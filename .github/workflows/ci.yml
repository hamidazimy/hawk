name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # CI pins the exact GCC version, rather than floating to whatever
      # ubuntu-latest happens to default to, so this job continuously
      # verifies the documented compiler floor (GCC 13+, see README.md's
      # Prerequisites) instead of silently testing a newer, stricter
      # toolchain if the runner image's default ever changes. GCC 13 is
      # preinstalled on the runner image already (alongside 12 and 14), so
      # it is selected explicitly rather than installed. Both C and CXX are
      # set because the vendored replxx subproject enables C.
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHAWK_BUILD_TESTS=ON
          -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build-msvc -DCMAKE_BUILD_TYPE=Release -DHAWK_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build-msvc --config Release

      - name: Test
        run: ctest --test-dir build-msvc -C Release --output-on-failure

  windows-mingw:
    name: Windows (MinGW cross-compile, via Wine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # This job cross-compiles for Windows from a Linux runner (the same
      # path build-mingw.sh uses locally) and then actually EXECUTES the
      # result under Wine, rather than only confirming it links. Wine and
      # mingw-w64 aren't preinstalled on ubuntu-latest -- both install
      # cleanly via apt. CMAKE_CROSSCOMPILING_EMULATOR=wine is the standard
      # CMake mechanism for running cross-compiled tests under an emulator:
      # every add_test-registered command (see tests/CMakeLists.txt) is
      # automatically prefixed with it, so `ctest` below needs no special
      # handling and reports the same pass/fail shape as the other three
      # jobs. This does NOT exercise hawk-cli's console/replxx/renderer
      # code -- see docs/testing.md's "Verifying CLI-side changes" section
      # for what remains behaviorally-verified-only on every platform,
      # Windows included.
      - name: Install MinGW + Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y mingw-w64 wine wine64

      - name: Configure
        run: >
          cmake -S . -B build-mingw
          -DCMAKE_TOOLCHAIN_FILE=mingw-toolchain.cmake
          -DHAWK_STATIC_BUILD=ON -DCMAKE_BUILD_TYPE=Release
          -DHAWK_BUILD_TESTS=ON -DCMAKE_CROSSCOMPILING_EMULATOR=wine

      - name: Build
        run: cmake --build build-mingw -j

      - name: Test (under Wine)
        run: ctest --test-dir build-mingw --output-on-failure

  macos:
    name: macOS (Clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # macOS is a tested bonus platform, not a guaranteed/required target
      # the way the Linux and Windows jobs are. No compiler version is
      # pinned here: macos-latest ships a single Apple Clang toolchain (via
      # Xcode) on PATH, not several side-by-side major versions the way
      # Ubuntu's apt does for GCC. This job simply confirms Hawk builds and
      # passes its test suite cleanly on whatever Apple Clang macos-latest
      # currently defaults to.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHAWK_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure
